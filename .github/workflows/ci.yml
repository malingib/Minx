name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go services and Core PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: |
            services/core/go.sum
            services/finance/go.sum
      - name: Resolve Core Go modules
        run: |
          cd services/core
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply Core schema migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d minx_test -v ON_ERROR_STOP=1 \
            -f services/core/db/migrations/000001_identity_organisations.up.sql
      - name: Verify Core row-level security
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d minx_test -v ON_ERROR_STOP=1 \
            -f services/core/db/tests/rls_smoke.sql
      - name: Install sqlc
        run: |
          curl -fsSL https://github.com/sqlc-dev/sqlc/releases/download/v1.31.1/sqlc_1.31.1_linux_amd64.tar.gz -o /tmp/sqlc.tar.gz
          echo '497ae4fcdfa64c5b0c311ffe4c2bd991e43991e82e5367792ed78bc2dca27354  /tmp/sqlc.tar.gz' | sha256sum --check
          tar -xzf /tmp/sqlc.tar.gz -C /tmp sqlc
          sudo install /tmp/sqlc /usr/local/bin/sqlc
      - name: Generate Core database bindings
        working-directory: services/core
        run: sqlc generate
      - name: Upload generated Core bindings
        uses: actions/upload-artifact@v4
        with:
          name: core-sqlc-generated
          path: services/core/internal/dbgen
          if-no-files-found: error
      - name: Format check
        run: |
          test -z "$(gofmt -l services/core services/finance)"
      - name: Test Core
        working-directory: services/core
        run: go test -race -cover ./...
      - name: Build Core
        working-directory: services/core
        run: go build ./...
      - name: Test Finance boundary
        working-directory: services/finance
        run: go test ./...
      - name: Build Finance boundary
        working-directory: services/finance
        run: go build ./...
