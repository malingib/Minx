name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: |
            services/core/go.sum
            services/finance/go.sum
      - name: Format check
        run: |
          test -z "$(gofmt -l services/core services/finance)"
      - name: Test Core
        working-directory: services/core
        run: go test -race -cover ./...
      - name: Build Core
        working-directory: services/core
        run: go build ./...
      - name: Test Finance boundary
        working-directory: services/finance
        run: go test ./...
      - name: Build Finance boundary
        working-directory: services/finance
        run: go build ./...
