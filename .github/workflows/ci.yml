name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go services and Core PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: minx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d minx_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/core/go.mod
          cache-dependency-path: |
            services/core/go.sum
            services/finance/go.sum
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
      - name: Apply Core schema migration
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d minx_test -v ON_ERROR_STOP=1 \
            -f services/core/db/migrations/000001_identity_organisations.up.sql
      - name: Verify Core row-level security
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d minx_test -v ON_ERROR_STOP=1 \
            -f services/core/db/tests/rls_smoke.sql
      - name: Format check
        run: |
          test -z "$(gofmt -l services/core services/finance)"
      - name: Test Core
        working-directory: services/core
        run: go test -race -cover ./...
      - name: Build Core
        working-directory: services/core
        run: go build ./...
      - name: Test Finance boundary
        working-directory: services/finance
        run: go test ./...
      - name: Build Finance boundary
        working-directory: services/finance
        run: go build ./...
